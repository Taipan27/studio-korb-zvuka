{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — STУDИЯ КОRБ.ЗVУКА</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">STУDИЯ КОRБ.ЗVУКА</div>
            <div class="auth-subtitle">Авторизация в личном кабинете</div>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="{{ form.username.id_for_label }}">Логин</label>
                    {{ form.username }}
                </div>
                <div class="form-group">
                    <label for="{{ form.password.id_for_label }}">Пароль</label>
                    {{ form.password }}
                </div>
                {% if form.non_field_errors %}
                    <ul class="errorlist">
                        {% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}
                    </ul>
                {% endif %}
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>

            <div class="auth-link">
                Нет аккаунта? <a href="{% url 'accounts:register' %}">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</body>
</html>
